name: CI
on:
  push:
    branches:
      - multi-courier-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
